name: Deploy Azure Container Apps

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-azure-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Backend + Frontend
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate required deployment secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPPS_ENV: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          AZURE_BACKEND_APP_NAME: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          AZURE_FRONTEND_APP_NAME: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          AZURE_BLOB_CONNECTION_STRING: ${{ secrets.AZURE_BLOB_CONNECTION_STRING }}
          AZURE_BLOB_CONTAINER: ${{ secrets.AZURE_BLOB_CONTAINER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=0
          for key in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_CONTAINERAPPS_ENV \
            AZURE_BACKEND_APP_NAME \
            AZURE_FRONTEND_APP_NAME \
            AZURE_BLOB_CONNECTION_STRING \
            AZURE_BLOB_CONTAINER \
            OPENROUTER_API_KEY \
            JWT_SECRET_KEY \
            DATABASE_URL; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Azure Login (OIDC via Azure CLI)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$OIDC_TOKEN"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Ensure Container Apps extension
        run: |
          az extension add --name containerapp --upgrade
          app_state=$(az provider show --namespace Microsoft.App --query registrationState -o tsv || echo "Unknown")
          logs_state=$(az provider show --namespace Microsoft.OperationalInsights --query registrationState -o tsv || echo "Unknown")

          if [ "$app_state" != "Registered" ] || [ "$logs_state" != "Registered" ]; then
            echo "Required Azure providers are not fully registered."
            echo "Microsoft.App: $app_state"
            echo "Microsoft.OperationalInsights: $logs_state"
            echo "Ask an Azure subscription owner to run:"
            echo "  az provider register --namespace Microsoft.App"
            echo "  az provider register --namespace Microsoft.OperationalInsights"
            exit 1
          fi

      - name: Validate backend DATABASE_URL secret
        run: |
          DB_URL="${{ secrets.DATABASE_URL }}"
          if [ -z "$DB_URL" ]; then
            echo "DATABASE_URL secret is empty."
            exit 1
          fi

          if echo "$DB_URL" | grep -Eq '@(localhost|127\.0\.0\.1|postgres)(:|/|\?)'; then
            echo "DATABASE_URL points to a local/container host (localhost/127.0.0.1/postgres)."
            echo "Use Azure PostgreSQL FQDN before deploying."
            exit 1
          fi

          if ! echo "$DB_URL" | grep -q 'sslmode=require'; then
            echo "DATABASE_URL must include sslmode=require for Azure PostgreSQL."
            exit 1
          fi

      - name: Resolve ACR and login
        id: acr
        run: |
          ACR_NAME="${{ secrets.AZURE_ACR_NAME }}"
          if [ -z "$ACR_NAME" ]; then
            ACR_NAME="ca3e2619e171acr"
          fi
          az acr show --name "$ACR_NAME" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null
          az acr update --name "$ACR_NAME" --admin-enabled true
          az acr login --name "$ACR_NAME"
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          ACR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "acr_username=$ACR_USERNAME" >> "$GITHUB_OUTPUT"
          echo "acr_password=$ACR_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        id: backend_image
        run: |
          BACKEND_IMAGE="${{ steps.acr.outputs.acr_login_server }}/ai-ops-backend:${{ github.sha }}"
          docker build -t "$BACKEND_IMAGE" .
          docker push "$BACKEND_IMAGE"
          echo "image=$BACKEND_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy backend from image
        env:
          ACR_LOGIN_SERVER: ${{ steps.acr.outputs.acr_login_server }}
          ACR_USERNAME: ${{ steps.acr.outputs.acr_username }}
          ACR_PASSWORD: ${{ steps.acr.outputs.acr_password }}
        run: |
          if az containerapp show \
            --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null 2>&1; then
            az containerapp registry set \
              --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --server "$ACR_LOGIN_SERVER" \
              --username "$ACR_USERNAME" \
              --password "$ACR_PASSWORD"
            az containerapp update \
              --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ steps.backend_image.outputs.image }}"
          else
            az containerapp create \
              --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ secrets.AZURE_CONTAINERAPPS_ENV }}" \
              --image "${{ steps.backend_image.outputs.image }}" \
              --target-port 8000 \
              --ingress external \
              --registry-server "${{ steps.acr.outputs.acr_login_server }}" \
              --registry-username "${{ steps.acr.outputs.acr_username }}" \
              --registry-password "${{ steps.acr.outputs.acr_password }}"
          fi

      - name: Configure backend secrets
        run: |
          az containerapp secret set \
            --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --secrets \
              jwt-secret-key="${{ secrets.JWT_SECRET_KEY }}" \
              openrouter-api-key="${{ secrets.OPENROUTER_API_KEY }}" \
              database-url="${{ secrets.DATABASE_URL }}" \
              blob-connection="${{ secrets.AZURE_BLOB_CONNECTION_STRING }}"

      - name: Configure backend environment
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars \
              ENVIRONMENT=production \
              LOG_JSON=true \
              DOCS_ENABLED=false \
              HEALTH_REQUIRE_LLM=true \
              JWT_SECRET_KEY=secretref:jwt-secret-key \
              OPENROUTER_API_KEY=secretref:openrouter-api-key \
              DATABASE_URL=secretref:database-url \
              STORAGE_PROVIDER=azure_blob \
              AZURE_BLOB_CONNECTION_STRING=secretref:blob-connection \
              AZURE_BLOB_CONTAINER="${{ secrets.AZURE_BLOB_CONTAINER }}" \
              OPENROUTER_BASE_URL=https://openrouter.ai/api/v1 \
              LLM_MODEL=openai/gpt-4o-mini

      - name: Fetch backend URL
        id: backend_url
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "backend_fqdn=$BACKEND_FQDN" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        id: frontend_image
        working-directory: frontend
        run: |
          FRONTEND_IMAGE="${{ steps.acr.outputs.acr_login_server }}/ai-ops-frontend:${{ github.sha }}"
          docker build -t "$FRONTEND_IMAGE" .
          docker push "$FRONTEND_IMAGE"
          echo "image=$FRONTEND_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend from image
        env:
          ACR_LOGIN_SERVER: ${{ steps.acr.outputs.acr_login_server }}
          ACR_USERNAME: ${{ steps.acr.outputs.acr_username }}
          ACR_PASSWORD: ${{ steps.acr.outputs.acr_password }}
        run: |
          if az containerapp show \
            --name "${{ secrets.AZURE_FRONTEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null 2>&1; then
            az containerapp registry set \
              --name "${{ secrets.AZURE_FRONTEND_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --server "$ACR_LOGIN_SERVER" \
              --username "$ACR_USERNAME" \
              --password "$ACR_PASSWORD"
            az containerapp update \
              --name "${{ secrets.AZURE_FRONTEND_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ steps.frontend_image.outputs.image }}"
          else
            az containerapp create \
              --name "${{ secrets.AZURE_FRONTEND_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ secrets.AZURE_CONTAINERAPPS_ENV }}" \
              --image "${{ steps.frontend_image.outputs.image }}" \
              --target-port 80 \
              --ingress external \
              --registry-server "${{ steps.acr.outputs.acr_login_server }}" \
              --registry-username "${{ steps.acr.outputs.acr_username }}" \
              --registry-password "${{ steps.acr.outputs.acr_password }}"
          fi

      - name: Configure frontend environment
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_FRONTEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars \
              API_BASE_URL=https://${{ steps.backend_url.outputs.backend_fqdn }} \
              DOCS_URL=https://${{ steps.backend_url.outputs.backend_fqdn }}/docs

      - name: Fetch frontend URL
        id: frontend_url
        run: |
          FRONTEND_FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_FRONTEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "frontend_fqdn=$FRONTEND_FQDN" >> "$GITHUB_OUTPUT"

      - name: Update backend CORS
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars CORS_ALLOWED_ORIGINS=https://${{ steps.frontend_url.outputs.frontend_fqdn }}

      - name: Deployment summary
        run: |
          echo "Backend: https://${{ steps.backend_url.outputs.backend_fqdn }}"
          echo "Frontend: https://${{ steps.frontend_url.outputs.frontend_fqdn }}"

      - name: Verify backend health
        run: |
          for i in {1..30}; do
            if curl -fsS "https://${{ steps.backend_url.outputs.backend_fqdn }}/health" > /dev/null; then
              echo "Backend /health is OK."
              break
            fi
            sleep 5
            if [ "$i" -eq 30 ]; then
              echo "Backend health check failed."
              exit 1
            fi
          done
          curl -fsS "https://${{ steps.backend_url.outputs.backend_fqdn }}/readyz" > /dev/null
          echo "Backend /readyz is OK."

      - name: Capture backend revision diagnostics on failure
        if: failure()
        run: |
          if ! az containerapp show \
            --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null 2>&1; then
            echo "Backend container app does not exist yet; skipping revision/log diagnostics."
            exit 0
          fi
          az containerapp revision list \
            --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -o table || true
          az containerapp logs show \
            --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --tail 200 || true

      - name: Verify frontend health
        run: |
          for i in {1..30}; do
            if curl -fsS "https://${{ steps.frontend_url.outputs.frontend_fqdn }}/" > /dev/null; then
              echo "Frontend is reachable."
              exit 0
            fi
            sleep 5
          done
          echo "Frontend health check failed."
          exit 1
