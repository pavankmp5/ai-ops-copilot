services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-ops-postgres
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ops-backend
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
      DATABASE_URL: postgresql://aiops:aiops_dev_password@postgres:5432/aiops
      STORAGE_PROVIDER: local
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-ops-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    environment:
      API_BASE_URL: http://localhost:8000
      DOCS_URL: http://localhost:8000/docs

volumes:
  postgres_data:
