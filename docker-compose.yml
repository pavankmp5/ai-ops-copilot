services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    container_name: ai-ops-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ops-backend
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      LOG_JSON: "true"
      STORAGE_PROVIDER: local
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-ops-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    environment:
      API_BASE_URL: http://backend:8000
      DOCS_URL: http://backend:8000/docs

volumes:
  postgres_data:
