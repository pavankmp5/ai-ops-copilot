services:
  backend:
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ops-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      LOG_JSON: "true"
      RUNNING_IN_DOCKER: "true"
      STORAGE_PROVIDER: local
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080
      DATABASE_URL: sqlite:////app/data/ai_ops_copilot.db
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-ops-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      API_BASE_URL: http://localhost:8000
      DOCS_URL: http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
