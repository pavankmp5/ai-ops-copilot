services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-ops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ops-backend
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      LOG_JSON: "true"
      STORAGE_PROVIDER: local
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080
      DATABASE_URL: sqlite:////app/data/ai_ops_copilot.db
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-ops-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    environment:
      API_BASE_URL: http://localhost:8000
      DOCS_URL: http://localhost:8000/docs

volumes:
  postgres_data:
